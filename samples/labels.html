<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>사진·영상 제목 크기 시안 — 전진오</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="labels.css">
  <script defer src="../portfolio-data.js"></script><script defer src="labels.js"></script>
</head>
<body data-size="B">
  <header class="sample-header"><a href="../">← 포트폴리오</a><span>사진·영상 제목 크기 시안</span></header>
  <main class="sample-shell">
    <div class="sample-intro"><p>TYPOGRAPHY PREVIEW</p><h1>조금 더 또렷하게.</h1><p>사진·영상 위의 작은 제목만 비교합니다. 본 사이트에는 아직 적용하지 않았습니다.</p></div>
    <fieldset class="size-options"><legend>제목 크기 선택</legend>
      <label><input type="radio" name="size" value="A"><span><b>A · 16px</b><small>보통 굵기 · 600</small><strong class="example example-a">배치·재생</strong><em>기존 11px에서 부담 없이 확대</em></span></label>
      <label><input type="radio" name="size" value="B" checked><span><b>B · 18px <i>추천</i></b><small>보통 굵기 · 600</small><strong class="example example-b">배치·재생</strong><em>구분은 선명하게, 사진과 균형 있게</em></span></label>
      <label><input type="radio" name="size" value="C"><span><b>C · 20px</b><small>굵게 · 700</small><strong class="example example-c">배치·재생</strong><em>사진·영상 제목을 확실하게 강조</em></span></label>
    </fieldset>
    <div class="preview-controls"><div class="demo-tabs" role="group" aria-label="예시 종류"><button type="button" data-demo="execution" aria-pressed="true">영상 2개</button><button type="button" data-demo="fade" aria-pressed="false">사진 3개</button></div><p id="current-size" aria-live="polite">B안 · 18px / 600</p></div>
    <section id="sample-stage" class="sample-stage" aria-label="선택한 제목 크기 미리보기"></section>
    <p class="sample-note">영상과 사진의 크기, 본문 글자 크기는 동일합니다. 위의 A·B·C를 눌러 비교한 뒤 채팅에서 원하는 안을 알려주세요.</p>
  </main>
</body></html>
